name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Il testo della release è il messaggio del tag annotato (lo mostra anche l'aggiornamento nell'app).
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --force --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Configure
        run: cmake -S src -B src/build -A x64

      - name: Build
        run: cmake --build src/build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: PerfOverlaySupreme
          path: src/build/bin/Release/PerfOverlaySupreme.exe

      # Un tag vX.Y.Z (es. git tag v1.0.0 && git push --tags) pubblica una release con l'exe.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/build/bin/Release/PerfOverlaySupreme.exe
          body_path: notes.md
          generate_release_notes: true
