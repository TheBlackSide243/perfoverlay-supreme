name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S src -B src/build -A x64

      - name: Build
        run: cmake --build src/build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: PerfOverlaySupreme
          path: src/build/bin/Release/PerfOverlaySupreme.exe

      # Un tag vX.Y.Z (es. git tag v1.0.0 && git push --tags) pubblica una release con l'exe.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/build/bin/Release/PerfOverlaySupreme.exe
          generate_release_notes: true
